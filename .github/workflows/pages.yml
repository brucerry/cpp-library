name: Update library and deploy Pages

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: "17 5 * * *"

permissions:
    contents: read

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - run: npm ci
            - run: npm run format:check
            - run: npm run sync
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - run: npm test
            - run: npx playwright install --with-deps chromium webkit
            - run: npm run test:browser
            - run: npm run test:examples
              env:
                  CXX: g++-14
            - name: Install LLVM 21 for additional library implementations
              run: |
                  sudo mkdir -p /etc/apt/keyrings
                  curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/llvm.gpg >/dev/null
                  echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list >/dev/null
                  sudo apt-get update
                  sudo apt-get install -y clang-21 libc++-21-dev libc++abi-21-dev
            - name: Check examples requiring libc++ facilities
              run: npm run test:examples
              env:
                  CXX: clang++-21
                  CXXFLAGS: -stdlib=libc++
                  EXAMPLE_REQUIRE_SUPPORT: "1"
                  EXAMPLE_FILTER: "^completion-(allocator-traits|flat_.*|mdspan|format$|format-queue|format-stack|format-priority_queue|pair-tuple|function-assign)$"
            - run: npm run build
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-24.04
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v4
              id: deployment
